name: Build desktop packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} (x64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            script: dist:linux
          - platform: Windows
            os: windows-2022
            script: dist:windows
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check release tag matches package version
        if: github.ref_type == 'tag'
        run: |
          node -e 'const expected = "v" + require("./package.json").version; if (process.env.GITHUB_REF_NAME !== expected) { console.error("Release tag must be " + expected); process.exit(1); }'
      - name: Install dependencies and Electron runtime
        run: |
          npm ci --no-audit --no-fund
          npx --no-install install-electron --no
          npm run install:check
      - name: Check syntax and packaging configuration
        run: npm run check
      - name: Run tests
        if: runner.os == 'Linux'
        run: npm test
      - name: Install Flatpak build tools and runtimes
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream libfuse2
          appstreamcli validate --no-net assets/linux/pt.jotta.edit.metainfo.xml
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08
      - name: Build desktop packages
        run: npm run "${{ matrix.script }}" -- --publish never
      - name: Package corresponding source
        if: runner.os == 'Linux'
        run: npm run build:source
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-x64
          path: |
            release/*.exe
            release/*.flatpak
            release/*.AppImage
            release/*-Source.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: packages
          merge-multiple: true
      - name: Create or update draft with all packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if ! jq -e '.isDraft == true' release.json > /dev/null; then
              echo 'This release is already published. Download rebuilt packages from the Actions artifacts.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Jotta Edit ${RELEASE_TAG#v}" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber

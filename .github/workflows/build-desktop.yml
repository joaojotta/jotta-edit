name: Build all packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    name: Validate and test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check release tag matches package version
        if: github.ref_type == 'tag'
        run: |
          node -e 'const expected = "v" + require("./package.json").version; if (process.env.GITHUB_REF_NAME !== expected) { console.error("Release tag must be " + expected); process.exit(1); }'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check desktop and web source
        run: |
          npm run check
          npm run check:web
      - name: Run tests
        run: npm test
      - name: Package corresponding source
        if: github.event_name != 'pull_request'
        run: |
          npm run licenses:generate
          npm run build:source
      - name: Upload source archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: package-source
          path: release/*-Source.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows
    needs: checks
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/windows.yml

  flatpak:
    name: Flatpak
    needs: checks
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/flatpak.yml

  appimage:
    name: AppImage
    needs: checks
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/appimage.yml

  web:
    name: Web / PWA
    needs: checks
    uses: ./.github/workflows/web.yml

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, windows, flatpak, appimage, web]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Verify release downloads and generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: packages
        run: |
          version="${RELEASE_TAG#v}"
          files=(
            "Jotta-Edit-${version}-Windows-x64-Portable.exe"
            "Jotta-Edit-${version}-linux-x86_64.flatpak"
            "Jotta-Edit-${version}-linux-x86_64.AppImage"
            "Jotta-Edit-${version}-Web-PWA-DEPLOY.zip"
            "Jotta-Edit-${version}-Source.tar.gz"
          )
          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty release download: $file" >&2
              exit 1
            fi
          done
          # Reject unexpected files rather than publishing stale or unrelated assets.
          shopt -s nullglob dotglob
          downloads=(*)
          if [ "${#downloads[@]}" -ne "${#files[@]}" ]; then
            echo 'Expected exactly five release downloads.' >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload all packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if ! jq -e '.isDraft == true' release.json > /dev/null; then
              echo 'This release is already published. Download rebuilt packages from the Actions artifacts.' >&2
              echo "Release already published: https://github.com/${GH_REPO}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Jotta Edit ${RELEASE_TAG#v}" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Published release: https://github.com/${GH_REPO}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"

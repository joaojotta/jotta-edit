name: Build Web

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Web / PWA deployment
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check web source
        run: npm run check:web
      - name: Build and verify deployable web files
        run: npm run build:pwa
      - name: Create deployment ZIP
        run: |
          version="$(node -p 'require("./package.json").version')"
          mkdir -p release
          archive="$GITHUB_WORKSPACE/release/Jotta-Edit-${version}-Web-PWA-DEPLOY.zip"
          (cd web-dist && zip -q -r "$archive" .)
          unzip -t "$archive"
      - name: Upload web deployment ZIP
        uses: actions/upload-artifact@v7
        with:
          name: package-web-pwa
          path: release/*-Web-PWA-DEPLOY.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

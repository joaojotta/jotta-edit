name: Build Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows portable (x64)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and Electron runtime
        run: |
          npm ci --no-audit --no-fund
          npx --no-install install-electron --no
          npm run install:check
      - name: Check source and packaging configuration
        run: npm run check
      - name: Build portable executable
        run: npm run dist:windows -- --publish never
      - name: Verify portable executable
        run: |
          node -e 'const fs = require("node:fs"); const v = require("./package.json").version; const file = "release/Jotta-Edit-" + v + "-Windows-x64-Portable.exe"; if (!fs.statSync(file).size) throw new Error("Empty executable: " + file); console.log(file);'
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: package-windows-x64
          path: release/*-Windows-x64-Portable.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
